# Render Blueprint: one free web service, no build step (the server has no npm dependencies).
# Deploy: push the repo to GitHub, then in Render choose New > Blueprint and select it.
# After the first deploy, set BASE_URL to the service URL Render gives you (https://<name>.onrender.com)
# and fill in the secrets marked "sync: false" in the dashboard. Never commit secrets.
services:
  - type: web
    name: haggle-bot
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SELLER_KEY
        generateValue: true          # your dashboard password; shown in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true          # signs login cookies, so sign-ins survive a restart
      - key: TRUST_PROXY
        value: "true"                # Render's proxy sets x-forwarded-for; needed for per-visitor rate limits and login lockout
      - key: BASE_URL
        sync: false                 # e.g. https://haggle-bot.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false                  # PayPal SANDBOX app credentials (US business account recommended)
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false                  # optional: register https://<url>/api/paypal/webhook in the PayPal dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox               # sandbox only; the server refuses to start with anything else
      - key: NODE_ENV
        value: production            # also arms the check that SELLER_KEY is not the default
      - key: LLM_PROVIDER
        value: groq                  # gemini | groq | compat | mock; falls back to the offline brain if a provider fails
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_API_KEY
        sync: false                  # optional second AI provider (free tier)
      - key: PERSIST
        value: "false"               # free instances have an ephemeral disk; deals live in memory
